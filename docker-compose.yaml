# StrIEM runs as three long-lived services plus a one-shot setup:
#
#   vector      normalizes incoming logs to OCSF and fans events out
#   detection   receives OCSF events over gRPC, runs Sigma, hosts the rule-admin API
#   api         serves the HTTP/UI, generates Vector's config, proxies rule admin
#
# Data flow:
#   vector --(OCSF, grpc)--> detection --(findings, grpc)--> vector --> storage
#   api  <--(admin, grpc)--> detection ;  vector <--(config, http)-- api
#
# `api` and `detection` share one image (built once); build it with
#   docker compose build
services:
  setup:
    build:
      context: .
      dockerfile: extra/Dockerfile.setup
    volumes:
      - ./data:/data
    restart: "no"

  api:
    image: striem:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["striem_api"]
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - STRIEM_API_ENABLED=1
      - STRIEM_API_ADDRESS=0.0.0.0:8080
      # Query database (DuckDB) + parquet storage the API reads for event queries.
      - STRIEM_DB=/data
      - STRIEM_STORAGE_PATH=/data/storage
      # Resolved into the generated Vector config's remap file paths.
      - STRIEM_REMAPS=/data/remaps
      # Where Vector should send OCSF events, and where the API administers rules.
      - STRIEM_FQDN=http://detection:9000
      - STRIEM_DETECTION_URL=http://detection:9000
      # Downstream Vector listeners the generated config wires up.
      - STRIEM_OUTPUT_URL=http://vector:6000
      - STRIEM_OUTPUT_HTTP_ADDRESS=0.0.0.0:9900
      - STRIEM_OUTPUT_HEC_ADDRESS=0.0.0.0:9990
      - STRIEM_OUTPUT_API_ADDRESS=0.0.0.0:9999
    volumes:
      - ./data:/data
    restart: unless-stopped

  detection:
    image: striem:latest
    command: ["usdetect"]
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
    environment:
      - RUST_LOG=info
      # gRPC listener: Vector event ingestion + the detection-admin API.
      - STRIEM_INPUT_ADDRESS=0.0.0.0:9000
      # Forward detection findings to the downstream Vector source.
      - STRIEM_OUTPUT_URL=http://vector:6000
      # Rules are ephemeral by default (loaded through the UI). To persist them
      # to the data volume across restarts instead, uncomment:
      # - STRIEM_DETECTIONS=/data/detections
    volumes:
      - ./data:/data
    restart: unless-stopped

  vector:
    image: vector:distroless-libc
    volumes:
      - ./extra/vector.yaml:/etc/vector/vector.yaml:ro
      # rw: Vector writes OCSF parquet to /data/storage and reads remaps.
      - ./data:/data
      # OCSF parquet schemas + remap.vrl the generated file sinks reference via
      # ${STRIEM_SCHEMA_DIR}, which Vector interpolates at load time.
      - ./schemas:/usr/share/striem/schemas:ro
    environment:
      # Versioned schema root: contains the per-category schema dirs + remap.vrl.
      - STRIEM_SCHEMA_DIR=/usr/share/striem/schemas/parquet/ocsf/v1.8.0
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    ports:
      - "9900:9900"  # HTTP log ingest
      - "9990:9990"  # Splunk HEC ingest
      - "9999:9999"  # Vector API
    depends_on:
      api:
        condition: service_started
      detection:
        condition: service_started
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.4-distroless
    environment:
      - CLICKHOUSE_USER=test
      - CLICKHOUSE_PASSWORD=testtest
    ports:
      - "8000:8000"
      - "8123:8123"
    volumes:
      - ./data/clickhouse.xml:/etc/clickhouse-server/config.d/clickhouse.xml

