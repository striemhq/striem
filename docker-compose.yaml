# StrIEM runs as three long-lived services plus a one-shot setup:
#
#   vector      normalizes incoming logs to OCSF and fans events out
#   detection   receives OCSF events over gRPC, runs Sigma (rsigma engine),
#               emits OCSF Detection Findings back to Vector
#   api         serves the HTTP/UI, generates Vector's config
#
# Data flow:
#   vector --(OCSF, grpc)--> detection --(findings, grpc)--> vector --> storage
#   vector <--(config, http)-- api
#
# The detection service runs `rsigma-detection`. Its rules live on disk
# (RSIGMA_DETECTION_RULES), and it hosts the detection-admin gRPC API over those
# files, so the api/UI rule proxy (STRIEM_DETECTION_URL) works against it.
#
# `api` and `detection` share one image (built once); build it with
#   docker compose build
services:
  setup:
    build:
      context: .
      dockerfile: extra/Dockerfile.setup
    volumes:
      - ./data:/data
    restart: "no"

  api:
    image: striem:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["striem_api"]
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - STRIEM_API_ENABLED=1
      - STRIEM_API_ADDRESS=0.0.0.0:8080
      - STRIEM_DB=/data
      - STRIEM_STORAGE_PATH=/data/storage
      - STRIEM_REMAPS=/data/remaps
      - STRIEM_FQDN=http://detection:9000
      - STRIEM_DETECTION_URL=http://detection:9000
      - STRIEM_OUTPUT_URL=http://vector:6000
      - STRIEM_OUTPUT_HTTP_ADDRESS=0.0.0.0:9900
      - STRIEM_OUTPUT_HEC_ADDRESS=0.0.0.0:9990
      - STRIEM_OUTPUT_API_ADDRESS=0.0.0.0:9999
    volumes:
      - ./data:/data
    restart: unless-stopped

  detection:
    image: striem:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "mkdir -p /data/detections && exec rsigma-detection"]
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9101:9101"  # Prometheus metrics
    environment:
      - RUST_LOG=debug
      - RSIGMA_DETECTION_INPUT=0.0.0.0:9000
      - RSIGMA_DETECTION_OUTPUT=http://vector:6000
      - RSIGMA_DETECTION_RULES=/data/detections
      - RSIGMA_DETECTION_METRICS=0.0.0.0:9101
    volumes:
      - ./data:/data
    restart: unless-stopped

  vector:
    image: vector:distroless-libc
    volumes:
      - ./extra/vector.yaml:/etc/vector/vector.yaml:ro
      - ./data:/data
      - ./schemas:/usr/share/striem/schemas:ro
    environment:
      - STRIEM_SCHEMA_DIR=/usr/share/striem/schemas/parquet/ocsf/v1.8.0
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    ports:
      - "9900:9900"  # HTTP log ingest
      - "9990:9990"  # Splunk HEC ingest
      - "9999:9999"  # Vector API
      - "9100:9100"  # Prometheus metrics (internal_metrics)
    depends_on:
      api:
        condition: service_started
      detection:
        condition: service_started
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.4-distroless
    environment:
      - CLICKHOUSE_USER=test
      - CLICKHOUSE_PASSWORD=testtest
    ports:
      - "8000:8000"
      - "8123:8123"
    volumes:
      - ./data/clickhouse.xml:/etc/clickhouse-server/config.d/clickhouse.xml

