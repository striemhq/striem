syntax = "proto3";

// Administration protocol for the StrIEM detection microservice.
//
// The protocol sends rules as JSON strings. Thus the detection engine keeps the
// single source of truth for the shape of a rule (Sigma -> serde_json). The API
// service is a thin proxy. It sends these payloads to and from its HTTP clients.
package striem.detection.v1;

service Detections {
  // Lists all the loaded rules as summary JSON objects.
  rpc List(ListRequest) returns (ListResponse);
  // Gets the full JSON of one rule by its id.
  rpc Get(GetRequest) returns (RuleResponse);
  // Adds a new rule from raw Sigma YAML.
  rpc Create(CreateRequest) returns (CreateResponse);
  // Enables or disables a rule that exists.
  rpc SetEnabled(SetEnabledRequest) returns (RuleResponse);
}

message ListRequest {}

message ListResponse {
  // Each entry is a JSON object: {id, title, description, enabled, level, logsource}.
  repeated string summaries = 1;
}

message GetRequest {
  string id = 1;
}

message RuleResponse {
  // The full rule as a JSON object.
  string rule = 1;
}

message CreateRequest {
  // Raw Sigma rule YAML.
  string yaml = 1;
}

message CreateResponse {
  string id = 1;
}

message SetEnabledRequest {
  string id = 1;
  bool enabled = 2;
}
