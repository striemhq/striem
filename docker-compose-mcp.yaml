# Overlay that adds the MCP action server and points the API at it.
# Run with: docker compose -f docker-compose.yaml -f docker-compose-mcp.yaml up
services:
  mcp:
    build:
      context: extra/mcp
      dockerfile: Dockerfile
    image: striem/mcp:latest
    ports:
      - "6000:6000"
    volumes:
      - ./data:/data
    environment:
      - LOG_LEVEL=info
      - STRIEM_MCP_PORT=6000
      - STRIEM_ACTIONS_PATH=/data/actions
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  setup:
    extends:
      file: docker-compose.yaml
      service: setup

  api:
    extends:
      file: docker-compose.yaml
      service: api
    environment:
      - STRIEM_API_MCP_URL=http://mcp:6000/mcp
    depends_on:
      mcp:
        condition: service_started

  detection:
    extends:
      file: docker-compose.yaml
      service: detection

  vector:
    extends:
      file: docker-compose.yaml
      service: vector
