apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "striem.detection.fullname" . }}
  labels:
    {{- include "striem.componentLabels" (dict "root" . "component" "detection") | nindent 4 }}
spec:
  replicas: {{ .Values.detection.replicas }}
  selector:
    matchLabels:
      {{- include "striem.componentSelectorLabels" (dict "root" . "component" "detection") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "striem.componentSelectorLabels" (dict "root" . "component" "detection") | nindent 8 }}
      {{- with .Values.detection.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "striem.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: detection
          image: {{ include "striem.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p {{ .Values.detection.rulesPath | default "/data/detections" }} && exec detection"]
          ports:
            - name: grpc
              containerPort: {{ .Values.detection.grpcPort }}
            - name: metrics
              containerPort: {{ .Values.detection.metricsPort }}
          env:
            - name: RUST_LOG
              value: {{ .Values.detection.logLevel | quote }}
            - name: RSIGMA_DETECTION_INPUT
              value: "0.0.0.0:{{ .Values.detection.grpcPort }}"
            # Findings sink: Vector's findings gRPC ingest.
            - name: RSIGMA_DETECTION_OUTPUT
              value: "http://{{ include "striem.vector.fullname" . }}:{{ .Values.vector.ports.findings }}"
            - name: RSIGMA_DETECTION_RULES
              value: {{ .Values.detection.rulesPath | default "/data/detections" | quote }}
            - name: RSIGMA_DETECTION_METRICS
              value: "0.0.0.0:{{ .Values.detection.metricsPort }}"
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
          volumeMounts:
            - name: rules
              mountPath: {{ .Values.detection.rulesPath | default "/data/detections" }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.detection.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: rules
          {{- if .Values.detection.rules.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "striem.detection.fullname" . }}-rules
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.detection.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.detection.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.detection.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.detection.rules.persistence.enabled }}
{{- $persistence := .Values.detection.rules.persistence }}
{{- $hostPath := $persistence.hostPath | default dict }}
{{- if $hostPath.path }}
# A hostPath PersistentVolume for the rules, bound only to the claim below.
# Retain: deleting the PV object (for example, on `helm uninstall`) never
# touches the directory on the node.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "striem.detection.rulesVolumeName" . }}
  labels:
    {{- include "striem.componentLabels" (dict "root" . "component" "detection") | nindent 4 }}
spec:
  capacity:
    storage: {{ $persistence.size }}
  accessModes:
    - {{ $persistence.accessMode }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ include "striem.detection.fullname" . }}-rules
  hostPath:
    path: {{ $hostPath.path | quote }}
    type: {{ $hostPath.type | default "DirectoryOrCreate" }}
  {{- with $hostPath.node }}
  # The directory exists only on this node, so the scheduler puts the
  # detection pod there.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "striem.detection.fullname" . }}-rules
  labels:
    {{- include "striem.componentLabels" (dict "root" . "component" "detection") | nindent 4 }}
spec:
  accessModes:
    - {{ $persistence.accessMode }}
  resources:
    requests:
      storage: {{ $persistence.size }}
  {{- if $hostPath.path }}
  # Bind to the hostPath PV above. The empty class stops the default storage
  # class from provisioning a different volume.
  storageClassName: ""
  volumeName: {{ include "striem.detection.rulesVolumeName" . }}
  {{- else if $persistence.storageClass }}
  storageClassName: {{ $persistence.storageClass | quote }}
  {{- end }}
{{- end }}
